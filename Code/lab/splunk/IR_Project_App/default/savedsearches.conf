[IR Lab - Repeated Failed Authentication]
description = Detect at least five failed logins from one source within five minutes in the safe lab.
search = index=ir_lab (sourcetype=linux:auth OR sourcetype=ir:simulation) ("Failed password" OR "event=failed_login") | rex field=_raw "(?:from\\s+|src_ip=)(?<src_ip>\\d{1,3}(?:\\.\\d{1,3}){3})" | bin _time span=5m | stats count earliest(_time) as first_seen latest(_time) as last_seen values(user) as users by _time src_ip | where count>=5 | convert ctime(first_seen) ctime(last_seen)
cron_schedule = */5 * * * *
dispatch.earliest_time = -10m@m
dispatch.latest_time = now
enableSched = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.track = 1
disabled = 0

[IR Lab - Sensitive File Change]
description = Detect audit-key or simulation events affecting the protected lab directory.
search = index=ir_lab ("ir_sensitive" OR "sensitive_file_modified") | table _time host source sourcetype _raw
cron_schedule = */10 * * * *
dispatch.earliest_time = -15m@m
dispatch.latest_time = now
enableSched = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.track = 1
disabled = 0
