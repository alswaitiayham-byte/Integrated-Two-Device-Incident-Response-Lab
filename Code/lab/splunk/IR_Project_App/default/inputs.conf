# The project Docker deployment mounts sample_data read-only at /opt/ir-sample-data.
# These are labelled synthetic course-lab records, not production telemetry.

[monitor:///opt/ir-sample-data/auth.log]
disabled = 0
index = ir_lab
sourcetype = linux:auth

[monitor:///opt/ir-sample-data/audit.log]
disabled = 0
index = ir_lab
sourcetype = linux:audit

[monitor:///opt/ir-sample-data/ir-lab-simulation.log]
disabled = 0
index = ir_lab
sourcetype = ir:simulation

[monitor:///opt/ir-sample-data/events.jsonl]
disabled = 0
index = ir_lab
sourcetype = _json
